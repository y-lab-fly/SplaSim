<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplaSim — 配信確認</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a18; --muted: #6b6b66;
    --line: #e3e3df; --ok: #1a7f4b; --ng: #c0392b; --card: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --fg: #ededea; --muted: #9a9a94;
      --line: #33333a; --ok: #4ade80; --ng: #f87171; --card: #1f1f24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem; background: var(--bg); color: var(--fg);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 2rem; font-size: .9rem; }
  .check {
    display: flex; align-items: baseline; gap: .75rem; padding: .85rem 1rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: .6rem;
  }
  .badge { font-weight: 600; font-size: .78rem; letter-spacing: .04em; white-space: nowrap; }
  .badge.ok { color: var(--ok); }
  .badge.ng { color: var(--ng); }
  .label { flex: 1; }
  .label small { display: block; color: var(--muted); font-size: .8rem; }
  dl { border-top: 1px solid var(--line); margin: 2rem 0 0; padding-top: 1.25rem; font-size: .85rem; }
  dt { color: var(--muted); }
  dd { margin: 0 0 .85rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>SplaSim — 配信確認</h1>
  <p class="sub">2リポジトリ構成の配信経路を検証するための仮ページ。</p>

  <div class="check">
    <span class="badge ok" id="b-page">PASS</span>
    <span class="label">ページが配信されている
      <small>この HTML が表示されている時点で成立</small></span>
  </div>

  <div class="check">
    <span class="badge ng" id="b-asset">FAIL</span>
    <span class="label">相対パスのアセットが解決できる
      <small>assets/check.js — サブパス配信で最も壊れやすい箇所</small></span>
  </div>

  <dl>
    <dt>URL</dt><dd id="v-url">—</dd>
    <dt>ベースパス</dt><dd id="v-base">—</dd>
    <dt>デプロイ識別子</dt><dd>manual-01</dd>
  </dl>
</main>

<script src="assets/check.js"></script>
<script>
  document.getElementById('v-url').textContent = location.href;
  document.getElementById('v-base').textContent =
    location.pathname.replace(/[^/]*$/, '') || '/';

  var b = document.getElementById('b-asset');
  if (window.SPLASIM_ASSET_OK === true) {
    b.textContent = 'PASS';
    b.className = 'badge ok';
  }
</script>
</body>
</html>
